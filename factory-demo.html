<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>CSS Factory Demo</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#eef4fb; display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* ── Animations ─────────────────────────── */
@keyframes crystalPulse {
  0%,100% { opacity:.65; filter:drop-shadow(0 0 5px #5ab4e8) drop-shadow(0 0 2px #fff); }
  50%      { opacity:1;   filter:drop-shadow(0 0 14px #5ab4e8) drop-shadow(0 0 6px #88d4ff); }
}
@keyframes ringExpand {
  0%   { r:22; opacity:.9; stroke-width:2.5; }
  100% { r:68; opacity:0;  stroke-width:.5; }
}
@keyframes conveyorDash {
  0%   { stroke-dashoffset:0; }
  100% { stroke-dashoffset:-48; }
}
@keyframes boxMove {
  0%   { transform:translate(0,0); opacity:1; }
  80%  { opacity:1; }
  100% { transform:translate(-88px,44px); opacity:0; }
}
@keyframes liquidDrop {
  0%,30%  { transform:translateY(0); opacity:.8; }
  80%,100%{ transform:translateY(34px); opacity:0; }
}
@keyframes armSway {
  0%,100% { transform:rotate(-2deg); }
  50%     { transform:rotate(2deg); }
}
@keyframes pipePulse {
  0%,100% { stroke-dashoffset:120; }
  50%     { stroke-dashoffset:0; }
}
@keyframes domeBreath {
  0%,100% { opacity:.52; }
  50%     { opacity:.72; }
}
@keyframes screenFlicker {
  0%,95%,100% { opacity:1; }
  97%         { opacity:.5; }
}
@keyframes ledBlink {
  0%,49%,51%,100% { fill:#ff6b6b; }
  50%             { fill:#ff0000; }
}
@keyframes particleFloat {
  0%   { transform:translate(0,0); opacity:.8; }
  100% { transform:translate(var(--tx),var(--ty)); opacity:0; }
}

.crystal { animation: crystalPulse 2.8s ease-in-out infinite; }
.c2 { animation-delay:.6s; }
.c3 { animation-delay:1.2s; }
.c4 { animation-delay:.3s; }
.c5 { animation-delay:1.8s; }
.c6 { animation-delay:.9s; }

.ring1 { animation: ringExpand 2.4s ease-out infinite; transform-origin:782px 394px; transform-box:view-box; }
.ring2 { animation: ringExpand 2.4s ease-out .8s infinite; transform-origin:782px 394px; transform-box:view-box; }
.ring3 { animation: ringExpand 2.4s ease-out 1.6s infinite; transform-origin:782px 394px; transform-box:view-box; }

.conveyor-dash { animation: conveyorDash 1.2s linear infinite; }
.box1 { animation: boxMove 3s linear infinite; }
.box2 { animation: boxMove 3s linear 1s infinite; }
.box3 { animation: boxMove 3s linear 2s infinite; }

.liquid { animation: liquidDrop 1.8s ease-in infinite; }

.arm-group { animation: armSway 4s ease-in-out infinite; transform-origin:782px 260px; transform-box:view-box; }

.pipe-flow {
  stroke-dasharray:8 6;
  animation: pipePulse 3s ease-in-out infinite;
}
.dome-glass { animation: domeBreath 4s ease-in-out infinite; }
.screen-inner { animation: screenFlicker 8s infinite; }
.led { animation: ledBlink 1.2s infinite; }
</style>
</head>
<body>
<svg viewBox="0 0 1000 560" width="100%" style="max-height:100vh" xmlns="http://www.w3.org/2000/svg">
<defs>

    <stop offset="0%" stop-color="#c0d4e4"/>
    <stop offset="100%" stop-color="#a8c0d4"/>
  </linearGradient>

  <!-- Screen -->
  <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1a3a5a"/>
    <stop offset="100%" stop-color="#0a2040"/>
  </linearGradient>

  <!-- Glow ring -->
  <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#5ab4e8" stop-opacity=".8"/>
    <stop offset="100%" stop-color="#5ab4e8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="platformGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#88d4ff" stop-opacity=".7"/>
    <stop offset="70%" stop-color="#5ab4e8" stop-opacity=".2"/>
    <stop offset="100%" stop-color="#5ab4e8" stop-opacity="0"/>
  </radialGradient>

  <!-- Pipe -->
  <linearGradient id="pipeH" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d4e8f4"/>
    <stop offset="50%" stop-color="#eaf4fc"/>
    <stop offset="100%" stop-color="#b8ccd8"/>
  </linearGradient>
  <linearGradient id="pipeV" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#c4d8e8"/>
    <stop offset="50%" stop-color="#daeefa"/>
    <stop offset="100%" stop-color="#a8c0d2"/>
  </linearGradient>

  <!-- Glow filter -->
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
  </filter>
  <filter id="tinyGlow">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Conveyor clip -->
  <clipPath id="convClip">
    <polygon points="510,348 696,252 714,265 528,362"/>
  </clipPath>
</defs>
